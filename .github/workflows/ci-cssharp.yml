name: CI (CounterStrikeSharp)

# Фильтр по путям: правка только в swiftly/ не должна гонять эту сборку.
# Обратная сторона — PR, не трогающий cssharp/, не даст здесь ни одного статуса;
# если когда-нибудь включим branch protection, этот чек обязательным делать нельзя.
on:
  push:
    branches: [main]
    paths:
      - 'cssharp/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-cssharp.yml'
  pull_request:
    paths:
      - 'cssharp/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-cssharp.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cssharp/NotifyMessages.sln

      - name: Build
        run: dotnet build cssharp/NotifyMessages.sln -c Release --no-restore

      - name: Test
        run: dotnet test cssharp/tests/NotifyMessages.Tests/NotifyMessages.Tests.csproj -c Release --no-build --verbosity normal
