name: CI (SwiftlyS2)

# Фильтр по путям: правка только в cssharp/ не должна гонять эту сборку.
#
# runs-on обязан быть x64: сборка SwiftlyS2.CS2 собрана только под эту архитектуру
# (выделенный сервер CS2 другой не бывает), и на arm64-раннере часть тестов
# честно пропустится вместо того, чтобы что-то проверить.
on:
  push:
    branches: [main]
    paths:
      - 'swiftly/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-swiftly.yml'
  pull_request:
    paths:
      - 'swiftly/**'
      - 'GeoIP/**'
      - '.github/workflows/ci-swiftly.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore swiftly/NotifyMessages.sln

      - name: Build
        run: dotnet build swiftly/NotifyMessages.sln -c Release --no-restore

      - name: Test
        run: dotnet test swiftly/tests/NotifyMessages.Swiftly.Tests/NotifyMessages.Swiftly.Tests.csproj -c Release --no-build --verbosity normal
