name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NotifyMessages.sln

      - name: Build
        run: dotnet build NotifyMessages.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/NotifyMessages.Tests/NotifyMessages.Tests.csproj -c Release --no-build --verbosity normal
