name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для ручного релиза (например v2.3.0)'
        required: true

permissions:
  contents: write

jobs:
  # Версия вычисляется ОДИН раз и раздаётся обеим целям: два плагина, собранные под
  # одним тегом, обязаны представляться серверу одним и тем же номером.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::не удалось вычислить версию из тега '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Тег $TAG -> версия $VERSION"

  cssharp:
    needs: version
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cssharp/NotifyMessages.sln

      - name: Build
        run: dotnet build cssharp/NotifyMessages.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      # Релиз не уезжает, если тесты красные
      - name: Test
        run: dotnet test cssharp/tests/NotifyMessages.Tests/NotifyMessages.Tests.csproj -c Release --no-build --verbosity normal

      # Свежие базы GeoLite2, если в репозитории задан секрет.
      # Без секрета в архив попадут закоммиченные копии из GeoIP/.
      - name: Package
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: dotnet build cssharp/NotifyMessages.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      # В релиз уходит ТОЛЬКО полный архив — с базами GeoLite2 внутри.
      # Архив без них выглядит рабочим до первого игрока, у которого не определилась страна.
      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="cssharp/bin/Release/net10.0/NotifyMessages_cssharp_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/counterstrikesharp/plugins/NotifyMessages
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }

          # Один снимок списка вместо конвейера на каждую проверку:
          # "unzip -l | grep -q" под pipefail падает на успешном совпадении
          # (grep -q выходит первым, unzip ловит SIGPIPE).
          unzip -l "$ZIP" | tee listing.txt

          for required in \
            "$PLUGIN_DIR/NotifyMessages.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/MaxMind.Db.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            grep -q -F "$required" listing.txt \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Конфиги плагин создаёт сам при первом запуске; в архиве им не место —
          # распаковка поверх рабочего сервера затёрла бы настройки админа.
          if grep -q -E 'Settings\.json|Messages\.json|Ads\.json|Servers\.json' listing.txt; then
            echo "::error::в архиве оказались конфиги"
            exit 1
          fi

      # Плагин должен представляться серверу ровно той версией, что стоит в теге.
      # ModuleVersion читает InformationalVersion, поэтому ищем её прямо в собранной DLL.
      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=cssharp/bin/Release/net10.0/NotifyMessages.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — ModuleVersion уедет мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-cssharp
          path: cssharp/bin/Release/net10.0/NotifyMessages_cssharp_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  swiftly:
    needs: version
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore swiftly/NotifyMessages.sln

      - name: Build
        run: dotnet build swiftly/NotifyMessages.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      - name: Test
        run: dotnet test swiftly/tests/NotifyMessages.Swiftly.Tests/NotifyMessages.Swiftly.Tests.csproj -c Release --no-build --verbosity normal

      - name: Package
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: dotnet build swiftly/NotifyMessages.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="swiftly/bin/Release/net10.0/NotifyMessages_swiftly_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/swiftlys2/plugins/NotifyMessages
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }

          unzip -l "$ZIP" | tee listing.txt

          for required in \
            "$PLUGIN_DIR/NotifyMessages.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/MaxMind.Db.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            grep -q -F "$required" listing.txt \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Сборки самого SwiftlyS2 предоставляет хост. Своя копия рядом с плагином —
          # это второй ISwiftlyCore в процессе и падение на первом же приведении типов.
          if grep -q -F 'SwiftlyS2' listing.txt; then
            echo "::error::в архиве оказались сборки SwiftlyS2 — их даёт хост"
            exit 1
          fi

          if grep -q -E 'Settings\.json|Messages\.json|Ads\.json|Servers\.json' listing.txt; then
            echo "::error::в архиве оказались конфиги"
            exit 1
          fi

      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=swiftly/bin/Release/net10.0/NotifyMessages.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — плагин представится серверу мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-swiftly
          path: swiftly/bin/Release/net10.0/NotifyMessages_swiftly_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: [version, cssharp, swiftly]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      # Полная история и теги: описание релиза собирается из коммитов между
      # предыдущим тегом и этим.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      # Описание собирается из коммитов, а не из файла: файл забывают обновить,
      # и релиз уезжает с описанием от прошлой версии. Коммиты забыть нельзя.
      #
      # Разбор по Conventional Commits (feat:, fix:, ...) — см. CONTRIBUTING.md.
      # Коммит не по форме не теряется: он попадает в "Other", потому что молча
      # выбросить изменение хуже, чем показать его без категории.
      - name: Compose release notes
        run: |
          set -euo pipefail

          PREV=$(git tag --list 'v*' --sort=-version:refname \
                 | grep -v -x -F "$RELEASE_TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            echo "Changes since $PREV"
          else
            RANGE="HEAD"
            echo "No previous tag - using the whole history"
          fi

          git log --no-merges --pretty=format:'%s' "$RANGE" > commits.txt
          wc -l commits.txt

          python3 - > notes-body.md <<'PY_EOF'
          import re, collections

          GROUPS = [
              ('feat',     'Added'),
              ('fix',      'Fixed'),
              ('perf',     'Performance'),
              ('refactor', 'Changed'),
              ('docs',     'Documentation'),
              ('build',    'Build'),
              ('ci',       'CI'),
              ('test',     'Tests'),
              ('chore',    'Chores'),
          ]
          TITLES = dict(GROUPS)
          HEADER = re.compile(r'^(?P<type>[a-z]+)(?:\((?P<scope>[^)]*)\))?(?P<bang>!)?: (?P<text>.+)$')

          buckets = collections.defaultdict(list)
          breaking, other = [], []

          for line in open('commits.txt', encoding='utf-8'):
              line = line.strip()
              if not line:
                  continue
              m = HEADER.match(line)
              if not m:
                  other.append(line)
                  continue
              text = m.group('text')
              scope = m.group('scope')
              entry = f'**{scope}**: {text}' if scope else text
              if m.group('bang'):
                  breaking.append(entry)
              elif m.group('type') in TITLES:
                  buckets[m.group('type')].append(entry)
              else:
                  other.append(line)

          out = []
          if breaking:
              out.append('### Breaking changes')
              out += [f'- {e}' for e in breaking] + ['']
          for key, title in GROUPS:
              if buckets[key]:
                  out.append(f'### {title}')
                  out += [f'- {e}' for e in buckets[key]] + ['']
          if other:
              out.append('### Other')
              out += [f'- {e}' for e in other] + ['']

          print('\n'.join(out).strip() or '_No changes in history._')
          PY_EOF

          {
            cat notes-body.md
            echo
            echo "---"
            echo
            echo "| Archive | Requirements | Installs into |"
            echo "|---|---|---|"
            echo "| \`NotifyMessages_cssharp_${PLUGIN_VERSION}.zip\` | CounterStrikeSharp >= 1.0.369 (.NET 10) | \`addons/counterstrikesharp/plugins/NotifyMessages/\` |"
            echo "| \`NotifyMessages_swiftly_${PLUGIN_VERSION}.zip\` | SwiftlyS2 >= 1.4.9, Metamod not needed | \`addons/swiftlys2/plugins/NotifyMessages/\` |"
            echo
            echo "Extract into the root of your game server — the directory layout is inside the archive."
            echo "Configs are created on first run:"
            echo
            echo "| Target | Config directory |"
            echo "|---|---|"
            echo "| CounterStrikeSharp | \`addons/counterstrikesharp/configs/plugins/NotifyMessages/\` |"
            echo "| SwiftlyS2 | \`addons/swiftlys2/configs/plugins/NotifyMessages/\` |"
            echo
            echo "The config files are identical between targets and move between them unchanged."
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*.zip
