name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для ручного релиза (например v2.3.0)'
        required: true

permissions:
  contents: write

jobs:
  # Версия вычисляется ОДИН раз и раздаётся всем трём целям: плагины, собранные под
  # одним тегом, обязаны представляться серверу одним и тем же номером.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::не удалось вычислить версию из тега '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Тег $TAG -> версия $VERSION"


  # Свежие базы GeoLite2 — ОДИН раз на релиз, для всех трёх целей: архивы одного
  # тега обязаны нести одну редакцию баз, а у MaxMind суточный лимит скачиваний.
  #
  # Ключ — секрет окружения RELEASE: секреты окружения видны ТОЛЬКО задачам с
  # `environment: RELEASE`. Пока ключ читался в задачах сборки без окружения, он
  # приходил пустой, и в архивы молча уезжали закоммиченные базы из GeoIP/.
  # Теперь ключ виден ровно одной задаче, а сборки получают готовые файлы артефактом.
  geoip:
    runs-on: ubuntu-latest
    environment: RELEASE
    outputs:
      edition: ${{ steps.fetch.outputs.edition }}
    steps:
      - uses: actions/checkout@v7

      - id: fetch
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p geoip-fresh

          # Без ключа (форк, окружение не настроено) — закоммиченные копии, но громко
          if [ -z "${MAXMIND_LICENSE_KEY:-}" ]; then
            echo "::warning::MAXMIND_LICENSE_KEY не задан в окружении RELEASE — в архивы уйдут базы из GeoIP/"
            cp GeoIP/GeoLite2-Country.mmdb GeoIP/GeoLite2-City.mmdb geoip-fresh/
            echo "edition=the copy committed to GeoIP/" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ключ задан, но скачать не вышло — релиз падает: молча выпустить старые
          # базы значит отменить то, ради чего ключ заведён
          for edition in GeoLite2-Country GeoLite2-City; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 10 \
              --output "$edition.tar.gz" \
              "https://download.maxmind.com/app/geoip_download?edition_id=$edition&license_key=$MAXMIND_LICENSE_KEY&suffix=tar.gz" \
              || { echo "::error::MaxMind не отдал $edition (проверьте ключ и лимит скачиваний)"; exit 1; }
            tar -xzf "$edition.tar.gz"
            cp "$edition"_*/"$edition.mmdb" geoip-fresh/
          done

          # Недокачанная база выглядит как обычная до первого чтения: проверяем размер
          # и маркер метаданных MMDB, который стоит в конце любого целого файла
          for file in geoip-fresh/GeoLite2-Country.mmdb:3000000 geoip-fresh/GeoLite2-City.mmdb:30000000; do
            path="${file%%:*}"; min="${file##*:}"
            size=$(stat -c %s "$path")
            [ "$size" -ge "$min" ] || { echo "::error::$path подозрительно мал: $size байт"; exit 1; }
            tail -c 200000 "$path" | grep -a -q -F "MaxMind.com" \
              || { echo "::error::$path не похож на MMDB: нет маркера метаданных"; exit 1; }
          done

          # Дата редакции — из имени каталога в архиве MaxMind: GeoLite2-City_20260922
          stamp=$(ls -d GeoLite2-City_* | head -n1 | sed 's/.*_//')
          echo "edition=MaxMind edition of ${stamp:0:4}-${stamp:4:2}-${stamp:6:2}" >> "$GITHUB_OUTPUT"
          ls -la geoip-fresh

      - uses: actions/upload-artifact@v7
        with:
          name: geoip
          path: geoip-fresh
          if-no-files-found: error

  cssharp:
    needs: [version, geoip]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Базы из задачи geoip поверх закоммиченных: MSBuild без ключа берёт ../GeoIP/
      - uses: actions/download-artifact@v8
        with:
          name: geoip
          path: GeoIP

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore cssharp/NotifyMessages.sln

      - name: Build
        run: dotnet build cssharp/NotifyMessages.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      # Релиз не уезжает, если тесты красные
      - name: Test
        run: dotnet test cssharp/tests/NotifyMessages.Tests/NotifyMessages.Tests.csproj -c Release --no-build --verbosity normal

      # Ключа MaxMind здесь нет сознательно: свежие базы уже лежат в GeoIP/
      # (задача geoip), и MSBuild копирует их оттуда
      - name: Package
        run: dotnet build cssharp/NotifyMessages.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      # В релиз уходит ТОЛЬКО полный архив — с базами GeoLite2 внутри.
      # Архив без них выглядит рабочим до первого игрока, у которого не определилась страна.
      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="cssharp/bin/Release/net10.0/NotifyMessages_cssharp_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/counterstrikesharp/plugins/NotifyMessages
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }

          # Один снимок списка вместо конвейера на каждую проверку:
          # "unzip -l | grep -q" под pipefail падает на успешном совпадении
          # (grep -q выходит первым, unzip ловит SIGPIPE).
          unzip -l "$ZIP" | tee listing.txt

          for required in \
            "$PLUGIN_DIR/NotifyMessages.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/MaxMind.Db.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            grep -q -F "$required" listing.txt \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Конфиги плагин создаёт сам при первом запуске; в архиве им не место —
          # распаковка поверх рабочего сервера затёрла бы настройки админа.
          if grep -q -E 'Settings\.json|Messages\.json|Ads\.json|Servers\.json' listing.txt; then
            echo "::error::в архиве оказались конфиги"
            exit 1
          fi

          # В архиве — ровно те базы, что скачала задача geoip
          for db in GeoLite2-Country.mmdb GeoLite2-City.mmdb; do
            [ "$(unzip -p "$ZIP" "$PLUGIN_DIR/$db" | sha256sum)" = "$(sha256sum < "GeoIP/$db")" ] \
              || { echo "::error::$db в архиве не совпадает с базой из задачи geoip"; exit 1; }
          done

      # Плагин должен представляться серверу ровно той версией, что стоит в теге.
      # ModuleVersion читает InformationalVersion, поэтому ищем её прямо в собранной DLL.
      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=cssharp/bin/Release/net10.0/NotifyMessages.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — ModuleVersion уедет мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-cssharp
          path: cssharp/bin/Release/net10.0/NotifyMessages_cssharp_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  swiftly:
    needs: [version, geoip]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Базы из задачи geoip поверх закоммиченных: MSBuild без ключа берёт ../GeoIP/
      - uses: actions/download-artifact@v8
        with:
          name: geoip
          path: GeoIP

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore swiftly/NotifyMessages.sln

      - name: Build
        run: dotnet build swiftly/NotifyMessages.sln -c Release --no-restore -p:Version=$PLUGIN_VERSION

      - name: Test
        run: dotnet test swiftly/tests/NotifyMessages.Swiftly.Tests/NotifyMessages.Swiftly.Tests.csproj -c Release --no-build --verbosity normal

      - name: Package
        run: dotnet build swiftly/NotifyMessages.csproj -c Release --no-incremental -p:Version=$PLUGIN_VERSION

      - name: Verify artifact
        run: |
          set -euo pipefail
          ZIP="swiftly/bin/Release/net10.0/NotifyMessages_swiftly_${PLUGIN_VERSION}.zip"
          PLUGIN_DIR=addons/swiftlys2/plugins/NotifyMessages
          test -f "$ZIP" || { echo "::error::$ZIP не собран"; exit 1; }

          unzip -l "$ZIP" | tee listing.txt

          for required in \
            "$PLUGIN_DIR/NotifyMessages.dll" \
            "$PLUGIN_DIR/MaxMind.GeoIP2.dll" \
            "$PLUGIN_DIR/MaxMind.Db.dll" \
            "$PLUGIN_DIR/GeoLite2-Country.mmdb" \
            "$PLUGIN_DIR/GeoLite2-City.mmdb"
          do
            grep -q -F "$required" listing.txt \
              || { echo "::error::в архиве нет $required"; exit 1; }
          done

          # Сборки самого SwiftlyS2 предоставляет хост. Своя копия рядом с плагином —
          # это второй ISwiftlyCore в процессе и падение на первом же приведении типов.
          if grep -q -F 'SwiftlyS2' listing.txt; then
            echo "::error::в архиве оказались сборки SwiftlyS2 — их даёт хост"
            exit 1
          fi

          if grep -q -E 'Settings\.json|Messages\.json|Ads\.json|Servers\.json' listing.txt; then
            echo "::error::в архиве оказались конфиги"
            exit 1
          fi

          # В архиве — ровно те базы, что скачала задача geoip
          for db in GeoLite2-Country.mmdb GeoLite2-City.mmdb; do
            [ "$(unzip -p "$ZIP" "$PLUGIN_DIR/$db" | sha256sum)" = "$(sha256sum < "GeoIP/$db")" ] \
              || { echo "::error::$db в архиве не совпадает с базой из задачи geoip"; exit 1; }
          done

      - name: Verify plugin version matches tag
        run: |
          set -euo pipefail
          DLL=swiftly/bin/Release/net10.0/NotifyMessages.dll
          if grep -a -q -F "$PLUGIN_VERSION" "$DLL"; then
            echo "OK: версия $PLUGIN_VERSION зашита в $DLL"
          else
            echo "::error::в $DLL нет версии $PLUGIN_VERSION — плагин представится серверу мимо тега"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-swiftly
          path: swiftly/bin/Release/net10.0/NotifyMessages_swiftly_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  # Ядро C++-цели проверяется без SDK — отдельной задачей, чтобы падение здесь
  # было сразу понятно чем вызвано
  metamod-core:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Core tests
        working-directory: metamod
        run: |
          make -f Makefile.tests -j"$(nproc)"
          ./build-tests/nm_tests

      - name: Core compiles as the game build does
        working-directory: metamod
        run: make -f Makefile.tests noexcept-check

      - name: AMBuilder builds every core source
        working-directory: metamod
        run: make -f Makefile.tests sources-check

  metamod-build:
    needs: [version, geoip, metamod-core]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
            container: ghcr.io/source2ze/build-containers:steamrt3
          - os: windows-latest
            slug: windows

    env:
      HL2SDKCS2: ${{ github.workspace }}/NotifyMessages/metamod/sdk
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          path: NotifyMessages
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: NotifyMessages/metamod/sdk
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk-manifests
          path: NotifyMessages/metamod/hl2sdk-manifests

      - uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      # AMBuild есть в образе SteamRT3; на Windows-раннере его ставим сами
      - uses: actions/checkout@v7
        if: matrix.os == 'windows-latest'
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools
          cd ambuild && python -m pip install .

      # PackageScript кладёт в архив базы из ../GeoIP/ — туда и распаковываем свежие
      - uses: actions/download-artifact@v8
        with:
          name: geoip
          path: NotifyMessages/GeoIP

      # Версия у всех трёх целей одна и берётся из тега. В C# её подставляет
      # MSBuild, здесь — генерируемый заголовок.
      - name: Stamp version
        shell: bash
        working-directory: NotifyMessages/metamod
        run: |
          set -euo pipefail
          cat > src/mm/version.h <<EOF
          // Сгенерировано CI из тега. Руками не править.
          #pragma once
          #define NM_VERSION "$PLUGIN_VERSION"
          EOF
          cat src/mm/version.h

      - name: Build plugin
        shell: bash
        working-directory: NotifyMessages/metamod
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          python ../configure.py --enable-optimize --sdks cs2
          ambuild

      - uses: actions/upload-artifact@v7
        with:
          name: metamod-tree-${{ matrix.slug }}
          path: NotifyMessages/metamod/build/package/cs2
          if-no-files-found: error

  # По архиву на ОС: половина содержимого общего архива не могла бы запуститься
  # на машине, куда его распаковали
  metamod-package:
    needs: [version, metamod-build]
    runs-on: ubuntu-latest
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: trees
          pattern: metamod-tree-*

      - uses: actions/download-artifact@v8
        with:
          name: geoip
          path: geoip

      - name: Zip per OS
        run: |
          set -euo pipefail

          for slug in linux windows; do
            case "$slug" in
              linux)
                binary="addons/NotifyMessages/bin/linuxsteamrt64/NotifyMessages.so"
                foreign="addons/NotifyMessages/bin/win64" ;;
              windows)
                binary="addons/NotifyMessages/bin/win64/NotifyMessages.dll"
                foreign="addons/NotifyMessages/bin/linuxsteamrt64" ;;
            esac

            tree="trees/metamod-tree-$slug"
            test -d "$tree" || { echo "::error::нет дерева $tree"; exit 1; }

            ZIP="$PWD/NotifyMessages_metamod_${slug}_${PLUGIN_VERSION}.zip"
            (cd "$tree" && zip -rq "$ZIP" .)

            # Список снимается ОДИН раз в файл: "unzip -l | grep -q" под pipefail
            # падает на УСПЕШНОМ совпадении (unzip получает SIGPIPE)
            unzip -l "$ZIP" > listing.txt
            cat listing.txt

            for required in \
              "$binary" \
              "addons/metamod/NotifyMessages.vdf" \
              "addons/NotifyMessages/GeoLite2-Country.mmdb" \
              "addons/NotifyMessages/GeoLite2-City.mmdb"
            do
              grep -q -F "$required" listing.txt \
                || { echo "::error::в архиве $slug нет $required"; exit 1; }
            done

            if grep -q -F "$foreign" listing.txt; then
              echo "::error::в архиве $slug оказались бинарники другой ОС"
              exit 1
            fi

            # Конфиги плагин создаёт сам — как и C#-цели, архив их не несёт
            if grep -q -E 'Settings\.json|Messages\.json|Ads\.json|Servers\.json' listing.txt; then
              echo "::error::в архиве $slug оказались конфиги"
              exit 1
            fi

            for db in GeoLite2-Country.mmdb GeoLite2-City.mmdb; do
              [ "$(unzip -p "$ZIP" "addons/NotifyMessages/$db" | sha256sum)" = "$(sha256sum < "geoip/$db")" ] \
                || { echo "::error::$db в архиве $slug не совпадает с базой из задачи geoip"; exit 1; }
            done

            # VDF — KeyValues, где обратный слэш начинает escape
            vdf=$(unzip -p "$ZIP" addons/metamod/NotifyMessages.vdf)
            echo "$vdf"
            case "$vdf" in
              *'\'*) echo "::error::в VDF архива $slug обратные слэши"; exit 1 ;;
            esac

            # Плагин обязан представляться версией из тега, а не фолбэком 0.0.0-dev
            unzip -p "$ZIP" "$binary" > plugin.bin
            grep -a -q -F "$PLUGIN_VERSION" plugin.bin \
              || { echo "::error::в $binary архива $slug нет версии $PLUGIN_VERSION"; exit 1; }
            if grep -a -q -F "0.0.0-dev" plugin.bin; then
              echo "::error::в $binary архива $slug остался фолбэк 0.0.0-dev"
              exit 1
            fi

            # Metamod находит плагин через dlsym("CreateInterface"); nm читает ELF,
            # objdump на Ubuntu умеет и PE. Через файл, не через pipe — см. выше.
            case "$slug" in
              linux)   nm -D --defined-only plugin.bin > exports.txt ;;
              windows) objdump -p plugin.bin > exports.txt ;;
            esac
            grep -q -w CreateInterface exports.txt \
              || { echo "::error::$binary архива $slug не экспортирует CreateInterface"; exit 1; }
            rm -f plugin.bin
          done

          ls -la NotifyMessages_metamod_*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-metamod
          path: NotifyMessages_metamod_*_${{ needs.version.outputs.version }}.zip
          if-no-files-found: error

  publish:
    needs: [version, geoip, cssharp, swiftly, metamod-package]
    runs-on: ubuntu-latest
    # Загрузка ассета на GitHub иногда зависает намертво; без лимита прогон висит до 6 часов
    timeout-minutes: 20
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      GEOIP_EDITION: ${{ needs.geoip.outputs.edition }}
    steps:
      # Полная история и теги: описание релиза собирается из коммитов между
      # предыдущим тегом и этим.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      # Описание собирается из коммитов, а не из файла: файл забывают обновить,
      # и релиз уезжает с описанием от прошлой версии. Коммиты забыть нельзя.
      #
      # Разбор по Conventional Commits (feat:, fix:, ...) — см. CONTRIBUTING.md.
      # Коммит не по форме не теряется: он попадает в "Other", потому что молча
      # выбросить изменение хуже, чем показать его без категории.
      - name: Compose release notes
        run: |
          set -euo pipefail

          PREV=$(git tag --list 'v*' --sort=-version:refname \
                 | grep -v -x -F "$RELEASE_TAG" | head -n1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..HEAD"
            echo "Changes since $PREV"
          else
            RANGE="HEAD"
            echo "No previous tag - using the whole history"
          fi

          git log --no-merges --pretty=format:'%s' "$RANGE" > commits.txt
          wc -l commits.txt

          python3 - > notes-body.md <<'PY_EOF'
          import re, collections

          GROUPS = [
              ('feat',     'Added'),
              ('fix',      'Fixed'),
              ('perf',     'Performance'),
              ('refactor', 'Changed'),
              ('docs',     'Documentation'),
              ('build',    'Build'),
              ('ci',       'CI'),
              ('test',     'Tests'),
              ('chore',    'Chores'),
          ]
          TITLES = dict(GROUPS)
          HEADER = re.compile(r'^(?P<type>[a-z]+)(?:\((?P<scope>[^)]*)\))?(?P<bang>!)?: (?P<text>.+)$')

          buckets = collections.defaultdict(list)
          breaking, other = [], []

          for line in open('commits.txt', encoding='utf-8'):
              line = line.strip()
              if not line:
                  continue
              m = HEADER.match(line)
              if not m:
                  other.append(line)
                  continue
              text = m.group('text')
              scope = m.group('scope')
              entry = f'**{scope}**: {text}' if scope else text
              if m.group('bang'):
                  breaking.append(entry)
              elif m.group('type') in TITLES:
                  buckets[m.group('type')].append(entry)
              else:
                  other.append(line)

          out = []
          if breaking:
              out.append('### Breaking changes')
              out += [f'- {e}' for e in breaking] + ['']
          for key, title in GROUPS:
              if buckets[key]:
                  out.append(f'### {title}')
                  out += [f'- {e}' for e in buckets[key]] + ['']
          if other:
              out.append('### Other')
              out += [f'- {e}' for e in other] + ['']

          print('\n'.join(out).strip() or '_No changes in history._')
          PY_EOF

          {
            cat notes-body.md
            echo
            echo "---"
            echo
            echo "| Archive | Requirements | Installs into |"
            echo "|---|---|---|"
            echo "| \`NotifyMessages_cssharp_${PLUGIN_VERSION}.zip\` | CounterStrikeSharp >= 1.0.369 (.NET 10) | \`addons/counterstrikesharp/plugins/NotifyMessages/\` |"
            echo "| \`NotifyMessages_swiftly_${PLUGIN_VERSION}.zip\` | SwiftlyS2 >= 1.4.9, Metamod not needed | \`addons/swiftlys2/plugins/NotifyMessages/\` |"
            echo "| \`NotifyMessages_metamod_linux_${PLUGIN_VERSION}.zip\` | Metamod:Source 2.0 >= git1460 (Linux) | \`addons/NotifyMessages/\` + \`addons/metamod/NotifyMessages.vdf\` |"
            echo "| \`NotifyMessages_metamod_windows_${PLUGIN_VERSION}.zip\` | Metamod:Source 2.0 >= git1460 (Windows) | \`addons/NotifyMessages/\` + \`addons/metamod/NotifyMessages.vdf\` |"
            echo
            echo "Extract into the root of your game server — the directory layout is inside the archive."
            echo "Configs are created on first run:"
            echo
            echo "| Target | Config directory |"
            echo "|---|---|"
            echo "| CounterStrikeSharp | \`addons/counterstrikesharp/configs/plugins/NotifyMessages/\` |"
            echo "| SwiftlyS2 | \`addons/swiftlys2/configs/plugins/NotifyMessages/\` |"
            echo "| Metamod:Source | \`addons/configs/NotifyMessages/\` |"
            echo
            echo "The config files are identical between targets and move between them unchanged."
            echo
            echo "GeoLite2 databases in every archive: ${GEOIP_EDITION}."
          } > release-notes.md

          cat release-notes.md

      # gh, а не softprops/action-gh-release: тот создаёт релиз и сразу параллельно грузит
      # оба архива, а релиз в API становится видимым по тегу не мгновенно — v2.3.0 упал ровно
      # так, "Error saving asset", при уже собранных и проверенных архивах.
      #
      # Файлы грузятся ПО ОДНОМУ, каждый под `timeout` и с повторами: загрузка ассета
      # на GitHub иногда зависает без ошибки (v2.3.2 простоял так 10 минут на втором
      # архиве), и без таймаута висел бы до лимита задачи. --clobber делает повтор
      # безопасным: недолитый файл перезаписывается. Черновик создаётся без файлов
      # и публикуется только когда все ассеты на месте — полурелиза не бывает.
      # Шаг идемпотентен: повторный запуск дозаливает файлы и обновляет описание.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag
          else
            echo "Релиз $RELEASE_TAG уже есть — дозаливаю файлы и обновляю описание"
          fi

          for file in artifacts/*.zip; do
            for attempt in 1 2 3; do
              echo "Загрузка $(basename "$file"), попытка $attempt"
              if timeout 240 gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::не удалось загрузить $(basename "$file") за 3 попытки"
                exit 1
              fi
              sleep 15
            done
          done

          # Публикуем только теперь: все ассеты уже на месте.
          # --latest — чтобы /releases/latest указывал сюда, а не на прошлую версию.
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG" \
            --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"

          # Проверка до конца: релиз опубликован (не draft) и все четыре архива на месте.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets \
            --jq '"draft=\(.isDraft) \(.url)", (.assets[] | "\(.name)\t\(.size) bytes")'
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::релиз $RELEASE_TAG остался черновиком"
            exit 1
          fi
          for required in "NotifyMessages_cssharp_${PLUGIN_VERSION}.zip" "NotifyMessages_swiftly_${PLUGIN_VERSION}.zip" \
                          "NotifyMessages_metamod_linux_${PLUGIN_VERSION}.zip" "NotifyMessages_metamod_windows_${PLUGIN_VERSION}.zip"; do
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -q -x -F "$required" || { echo "::error::в релизе нет $required"; exit 1; }
          done
